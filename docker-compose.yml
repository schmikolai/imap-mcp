services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: imapmcp
      POSTGRES_USER: imapmcp
      POSTGRES_PASSWORD: imapmcp
    ports:
      - "5432:5432"
    volumes:
      - imapmcp-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imapmcp -d imapmcp"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  imapmcp-postgres-data:
