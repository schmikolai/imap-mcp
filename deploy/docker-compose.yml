# Production stack.
#
# Usage:
#   ./generate-env.sh                                  # once, to create .env
#   # then fill in IMAGE, OPENBAO_TOKEN, OAUTH_ISSUER_URI in .env — see
#   # generate-env.sh's own output for exactly which keys need manual values,
#   # and README.md's "Production setup: OpenBao" for how to obtain the token
#   docker compose -f docker-compose.prod.yml up -d
#
# Unlike docker-compose.yml at the repo root (local dev), postgres/redis
# ports are not published to the host — only the app talks to them, over
# the compose-internal network. Put a reverse proxy in front of the app
# port for TLS; this compose file only terminates plain HTTP.
name: imap-mcp

services:
  app:
    logging:
      driver: loki
      options:
        loki-url: "http://localhost:3100/loki/api/v1/push"
    image: ${IMAGE}:${IMAGE_TAG}
    pull_policy: always
    env_file:
      - .env
    labels:
      - traefik.enable=true
      - traefik.http.routers.imap-mcp.rule=Host(`imap-mcp.schmikolai.de`)
      - traefik.http.routers.imap-mcp.tls=true
      - traefik.http.routers.imap-mcp.entrypoints=websecure
      - traefik.http.routers.imap-mcp.tls.certresolver=mytlschallenge
      - traefik.docker.network=shared
    networks:
      - default
      - shared
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      openbao:
        condition: service_started
    restart: unless-stopped

  postgres:
    logging:
      driver: loki
      options:
        loki-url: "http://localhost:3100/loki/api/v1/push"
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${DB_OWNER_USER}
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD}
    volumes:
      - imapmcp-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_OWNER_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    logging:
      driver: loki
      options:
        loki-url: "http://localhost:3100/loki/api/v1/push"
    image: redis:7-alpine
    volumes:
      - imapmcp-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Self-hosted KMS replacement (Transit secrets engine) — see
  # "Credential encryption" in CLAUDE.md. Never publish 8200 externally;
  # only the app talks to it, over the compose-internal network. Comes up
  # sealed after every restart — see the one-time setup / post-restart
  # unseal runbook in README.md before the app can encrypt/decrypt anything.
  openbao:
    logging:
      driver: loki
      options:
        loki-url: "http://localhost:3100/loki/api/v1/push"
    image: openbao/openbao:2.1.0
    # No explicit -config flag here: docker-entrypoint.sh already injects
    # "-config=/openbao/config" (BAO_CONFIG_DIR) whenever the first arg is
    # "server". Adding our own -config pointing at the file inside that same
    # directory made bao parse config.hcl twice and try to bind :8200 twice
    # in one process ("address already in use") — a real boot loop this
    # caused in production. Just mounting the file into BAO_CONFIG_DIR is
    # enough.
    command: ["server"]
    volumes:
      - ./openbao/config.hcl:/openbao/config/config.hcl:ro
      - imapmcp-openbao-data:/openbao/file
    restart: unless-stopped

volumes:
  imapmcp-postgres-data:
  imapmcp-redis-data:
  imapmcp-openbao-data:

networks:
  default:
  shared:
    external: true
    name: shared
