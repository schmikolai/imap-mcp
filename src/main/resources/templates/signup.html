<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Sign up — imap-mcp</title>
</head>
<body>
<h1>Create your account</h1>

<p th:if="${error}" th:text="${error}" style="color:red;"></p>

<form th:action="@{/signup}" th:object="${signupRequest}" method="post">
    <div>
        <label for="email">Email</label>
        <input type="email" id="email" th:field="*{email}" required="required"/>
        <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" style="color:red;"></span>
    </div>
    <div>
        <label for="password">Password</label>
        <input type="password" id="password" th:field="*{password}" required="required" minlength="12"/>
        <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" style="color:red;"></span>
    </div>
    <button type="submit">Sign up</button>
</form>

<p>Already have an account? <a th:href="@{/login}">Log in</a></p>
</body>
</html>
