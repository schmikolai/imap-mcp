<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Log in — imap-mcp</title>
</head>
<body>
<h1>Log in</h1>

<p th:if="${param.error}" style="color:red;">Invalid email or password.</p>
<p th:if="${param.signupSuccess}" style="color:green;">Account created — you can log in now.</p>
<p th:if="${param.logout}">You have been logged out.</p>

<form th:action="@{/login}" method="post">
    <div>
        <label for="username">Email</label>
        <input type="email" id="username" name="username" required="required"/>
    </div>
    <div>
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required="required"/>
    </div>
    <button type="submit">Log in</button>
</form>

<p>No account yet? <a th:href="@{/signup}">Sign up</a></p>
</body>
</html>
