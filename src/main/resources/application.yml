spring:
  application:
    name: imap-mcp

  # The app's OWN runtime connection — deliberately the least-privilege role
  # (see V4 migration), never the schema owner. RLS only means anything if
  # the running app can't bypass it.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/imapmcp}
    username: ${DB_APP_USER:imapmcp_app}
    password: ${DB_APP_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  # Flyway runs DDL, so it connects as the schema-owning role — separate
  # from spring.datasource.* above, which is intentionally unprivileged.
  flyway:
    enabled: true
    locations: classpath:db/migration
    url: ${DB_URL:jdbc:postgresql://localhost:5432/imapmcp}
    user: ${DB_OWNER_USER:imapmcp}
    password: ${DB_OWNER_PASSWORD:}
    placeholders:
      # Camel-case keys here on purpose: Flyway's placeholder map keys are
      # taken verbatim from the property source (not relaxed-bound like
      # normal bean properties), so these must match the ${appDbUser} /
      # ${appDbPassword} tokens in the migration SQL exactly.
      appDbUser: ${DB_APP_USER:imapmcp_app}
      appDbPassword: ${DB_APP_PASSWORD:}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}

imapmcp:
  crypto:
    kms-key-id: ${KMS_KEY_ID:}
    aws-region: ${AWS_REGION:eu-central-1}
  imap:
    connect-timeout-ms: 10000
    read-timeout-ms: 15000
    max-connections-per-account: 2
    lockout-threshold: 5
    lockout-backoff-seconds: 300
  oauth:
    issuer-uri: ${OAUTH_ISSUER_URI:http://localhost:8080}
    seed-client:
      client-id: ${OAUTH_SEED_CLIENT_ID:}
      client-secret: ${OAUTH_SEED_CLIENT_SECRET:}
      display-name: ${OAUTH_SEED_CLIENT_NAME:Development test client}
      redirect-uris: ${OAUTH_SEED_CLIENT_REDIRECT_URIS:}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    console: "%d{ISO8601} %-5level [%thread] %logger{36} - %msg%n"
