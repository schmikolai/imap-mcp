spring:
  application:
    name: imap-mcp

  # The app's OWN runtime connection — deliberately the least-privilege role
  # (see V4 migration), never the schema owner. RLS only means anything if
  # the running app can't bypass it.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/imapmcp}
    username: ${DB_APP_USER:imapmcp_app}
    password: ${DB_APP_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  # Flyway runs DDL, so it connects as the schema-owning role — separate
  # from spring.datasource.* above, which is intentionally unprivileged.
  flyway:
    enabled: true
    locations: classpath:db/migration
    url: ${DB_URL:jdbc:postgresql://localhost:5432/imapmcp}
    user: ${DB_OWNER_USER:imapmcp}
    password: ${DB_OWNER_PASSWORD:}
    placeholders:
      # Camel-case keys here on purpose: Flyway's placeholder map keys are
      # taken verbatim from the property source (not relaxed-bound like
      # normal bean properties), so these must match the ${appDbUser} /
      # ${appDbPassword} tokens in the migration SQL exactly.
      appDbUser: ${DB_APP_USER:imapmcp_app}
      appDbPassword: ${DB_APP_PASSWORD:}
      grafanaDbUser: ${DB_GRAFANA_USER:grafana_ro}
      grafanaDbPassword: ${DB_GRAFANA_PASSWORD:}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}

imapmcp:
  crypto:
    openbao-address: ${OPENBAO_ADDR:}
    openbao-token: ${OPENBAO_TOKEN:}
    transit-key-name: ${OPENBAO_TRANSIT_KEY:imap-mcp-dek}
  imap:
    connect-timeout-ms: 10000
    read-timeout-ms: 15000
    max-connections-per-account: 2
    lockout-threshold: 5
    lockout-backoff-seconds: 300
  oauth:
    issuer-uri: ${OAUTH_ISSUER_URI:http://localhost:8080}
    seed-client:
      client-id: ${OAUTH_SEED_CLIENT_ID:}
      client-secret: ${OAUTH_SEED_CLIENT_SECRET:}
      display-name: ${OAUTH_SEED_CLIENT_NAME:Development test client}
      redirect-uris: ${OAUTH_SEED_CLIENT_REDIRECT_URIS:}
  rate-limit:
    # "N requests per period" buckets, distributed via Redis (see
    # RateLimitConfig) so limits hold even across multiple instances.
    mcp-tool-calls:
      capacity: 60
      refill-period: 1m
    oauth-endpoints:
      capacity: 20
      refill-period: 1m
    web-auth:
      capacity: 10
      refill-period: 1m

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        # Only genuine upstream/connection failures should trip the breaker
        # — a bad folder name or missing UID (NoSuchElementException) is a
        # client input error, not IMAP server flakiness, and must not count.
        record-exceptions:
          - io.imapmcp.imap.ImapMailService.ImapOperationException

management:
  # Deliberately a separate port, never published in docker-compose.yml or a
  # deploy's port mapping. Requests on this port still go through the same
  # SecurityFilterChains as the main port (no isolated child security
  # context in this setup) — see SecurityConfig's permitAll on
  # /actuator/health and /actuator/prometheus, guarded by network isolation
  # (the port itself is never exposed) rather than application-level auth.
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
